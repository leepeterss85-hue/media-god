name: Apply streaming service rows once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-streaming-service-rows-once.yml"
      - "scripts/apply_streaming_service_rows.py"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply streaming service rows
        run: python scripts/apply_streaming_service_rows.py

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Run UI regression checks
        run: node scripts/ui-regression-check.mjs

      - name: Commit streaming service rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            base44/functions/getTmdbMovies/entry.ts \
            src/components/mg/streamingServices.js \
            src/components/mg/StreamingServiceRows.jsx \
            src/components/mg/MediaRow.jsx \
            src/components/mg/HomeDashboard.jsx \
            src/components/mg/TvShowsView.jsx \
            src/pages/Home.jsx \
            scripts/ui-regression-check.mjs
          git rm scripts/apply_streaming_service_rows.py .github/workflows/apply-streaming-service-rows-once.yml
          git commit -m "Add streaming service rows to Home and TV"
          git push origin HEAD:main
