name: Android APKs - Test and Release

on:
  pull_request:
    paths:
      - "android-mobile/**"
      - "firetv-android/**"
      - "src/components/mg/**"
      - "public/android-mobile-update.json"
      - "public/firetv-update.json"
      - "scripts/**"
      - ".github/workflows/android-apks.yml"
  push:
    branches: [main]
    paths:
      - "android-mobile/**"
      - "firetv-android/**"
      - "src/components/mg/**"
      - "public/android-mobile-update.json"
      - "public/firetv-update.json"
      - "scripts/**"
      - ".github/workflows/android-apks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-god-android-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Web and source regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:regression

  build-check:
    name: Build check - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android phone/tablet
            dir: android-mobile
          - name: Fire TV/Stick
            dir: firetv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile debug APK
        run: gradle -p "${{ matrix.dir }}" :app:assembleDebug --stacktrace

  device-regression:
    name: Device regression - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android phone/tablet
            dir: android-mobile
          - name: Fire TV/Stick
            dir: firetv-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run playback lifecycle regression on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p "${{ matrix.dir }}" :app:connectedDebugAndroidTest --stacktrace

  release:
    name: Release both APKs
    if: github.event_name != 'pull_request'
    needs: [regression, build-check, device-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIRETV_KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
      FIRETV_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
      FIRETV_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
      FIRETV_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
      MOBILE_KEYSTORE_PATH: mobile-release.jks
      MOBILE_KEYSTORE_BASE64: ${{ secrets.FIRETV_KEYSTORE_BASE64 }}
      MOBILE_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
      MOBILE_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
      MOBILE_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
      FIRETV_KEYSTORE_PATH: firetv-release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate update manifests
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          pairs = [
              ("android-mobile/app/build.gradle.kts", "public/android-mobile-update.json", "Mobile"),
              ("firetv-android/app/build.gradle.kts", "public/firetv-update.json", "Fire TV"),
          ]
          for gradle_path, manifest_path, label in pairs:
              gradle = Path(gradle_path).read_text()
              manifest = json.loads(Path(manifest_path).read_text())
              code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
              name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
              if (manifest.get("versionCode"), manifest.get("versionName")) != (code, name):
                  raise SystemExit(f"{label} manifest does not match APK version")
              print(f"{label}: {name} ({code})")
          PY
      - name: Restore signing keys
        run: |
          set -euo pipefail
          for value in FIRETV_KEYSTORE_BASE64 FIRETV_KEYSTORE_PASSWORD FIRETV_KEY_ALIAS FIRETV_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then echo "Missing signing secret: $value"; exit 1; fi
          done
          printf '%s' "$FIRETV_KEYSTORE_BASE64" | base64 --decode > "firetv-android/app/$FIRETV_KEYSTORE_PATH"
          printf '%s' "$MOBILE_KEYSTORE_BASE64" | base64 --decode > "android-mobile/app/$MOBILE_KEYSTORE_PATH"
      - name: Build both signed release APKs
        run: |
          gradle -p android-mobile :app:assembleRelease --stacktrace
          gradle -p firetv-android :app:assembleRelease --stacktrace
          cp android-mobile/app/build/outputs/apk/release/app-release.apk Media-God-Android-Mobile.apk
          cp firetv-android/app/build/outputs/apk/release/app-release.apk Media-God-Fire-TV.apk
      - name: Verify APK signing identities
        run: |
          keytool -printcert -jarfile Media-God-Android-Mobile.apk | grep -E "Owner:|SHA256:" || true
          keytool -printcert -jarfile Media-God-Fire-TV.apk | grep -E "Owner:|SHA256:" || true
      - name: Upload coordinated APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Media-God-Android-APKs
          path: |
            Media-God-Android-Mobile.apk
            Media-God-Fire-TV.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable phone and Fire TV downloads from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ensure_release() {
            tag="$1"; title="$2"; notes="$3"; asset="$4"

            # Stable "latest" releases are disposable pointers. Recreate them
            # instead of using --clobber: GitHub can retain a stale asset ID
            # briefly after a previous upload, causing gh release upload
            # --clobber to fail with HTTP 404 while deleting that old asset.
            # Recreating preserves the same public /releases/download/<tag>/
            # URL while guaranteeing the tag and asset both belong to this SHA.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
            fi

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              "$asset"
          }
          ensure_release "android-mobile-latest" "Media God Mobile - Android Phone and Tablet" "Latest tested Media God Android phone/tablet build. Released in lockstep with the Fire TV APK from commit $GITHUB_SHA." "Media-God-Android-Mobile.apk"
          ensure_release "firetv-latest" "Media God Fire TV" "Latest tested Media God Fire TV/Stick build. Released in lockstep with the phone/tablet APK from commit $GITHUB_SHA." "Media-God-Fire-TV.apk"
