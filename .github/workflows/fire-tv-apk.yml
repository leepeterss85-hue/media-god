name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firetv-android/**"
      - "src/components/mg/nativeFireTvBridge.js"
      - "src/components/mg/VideoPlayer.jsx"
      - "src/components/mg/fireTvStableMode.js"
      - "src/main.jsx"
      - ".github/workflows/fire-tv-apk.yml"

permissions:
  contents: write

jobs:
  build-fire-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p firetv-android :app:assembleDebug --stacktrace

      - name: Prepare named Fire TV APK
        run: cp firetv-android/app/build/outputs/apk/debug/app-debug.apk Media-God-Fire-TV.apk

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-God-Fire-TV
          path: Media-God-Fire-TV.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable latest Fire TV download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view firetv-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create firetv-latest \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Media God Fire TV" \
              --notes "Latest sideloadable Media God build for Amazon Fire TV and Fire Stick."
          fi

          gh release upload firetv-latest Media-God-Fire-TV.apk \
            --repo "${{ github.repository }}" \
            --clobber
