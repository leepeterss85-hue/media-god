name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firetv-android/**"
      - "src/components/mg/nativeFireTvBridge.js"
      - "src/components/mg/VideoPlayer.jsx"
      - "src/components/mg/fireTvStableMode.js"
      - "src/main.jsx"
      - ".github/workflows/fire-tv-apk.yml"

permissions:
  contents: read

jobs:
  build-fire-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p firetv-android :app:assembleDebug --stacktrace

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-God-Fire-TV
          path: firetv-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
