name: Apply advanced playback experience upgrade once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-playback-resilience-once.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply advanced playback experience suite
        run: python scripts/apply_playback_experience_suite.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run web and native regression checks
        run: |
          npm ci
          npm run build
          node scripts/ui-regression-check.mjs
          node scripts/native-structure-check.mjs

      - name: Compile Fire TV debug APK
        run: gradle -p firetv-android :app:assembleDebug --stacktrace

      - name: Compile Android phone and tablet debug APK
        run: gradle -p android-mobile :app:assembleDebug --stacktrace

      - name: Commit advanced playback experience upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/mg/VideoPlayer.jsx \
            src/components/mg/SettingsView.jsx \
            src/components/mg/PlaybackAdvancedSettings.jsx \
            src/components/mg/playbackPreferences.js \
            src/components/mg/nativeFireTvBridge.js \
            firetv-android/app/src/main/java/com/mediagod/firetv/MainActivity.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/PlayerActivity.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/CompatibilityPlayerActivity.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/PlaybackCompatibilityRouter.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/NativeStreamPreflight.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/NativePlaybackDiagnostics.kt \
            firetv-android/app/src/main/java/com/mediagod/firetv/DevicePerformanceGuard.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/MainActivity.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/PlayerActivity.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/CompatibilityPlayerActivity.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/PlaybackCompatibilityRouter.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/NativeStreamPreflight.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/NativePlaybackDiagnostics.kt \
            android-mobile/app/src/main/java/com/mediagod/mobile/DevicePerformanceGuard.kt \
            firetv-android/app/build.gradle.kts \
            android-mobile/app/build.gradle.kts \
            public/firetv-update.json \
            public/android-mobile-update.json \
            scripts/native-structure-check.mjs \
            scripts/ui-regression-check.mjs
          git commit -m "Add advanced playback audio subtitle network and device recovery"
          git push origin HEAD:main