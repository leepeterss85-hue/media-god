name: Apply safe app polish once

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_safe_app_polish.py
      - scripts/apply_safe_app_polish_v2.py
      - .github/workflows/apply-safe-app-polish-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Apply safe polish patch
        run: python scripts/apply_safe_app_polish_v2.py

      - name: Install dependencies
        run: npm ci

      - name: Run full regression gate
        run: npm run test:regression

      - name: Commit safe polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Polish app loading and resilience"
          git push origin HEAD:main
