name: Finish episode playback once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-episode-playback-finish-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply episode playback finishing patch
        run: python scripts/apply_episode_playback_finish.py

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run Media God regression gate
        run: npm run test:regression

      - name: Run focused episode playback gate
        run: node scripts/episode-playback-regression-check.mjs

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile Fire TV debug APK
        run: gradle -p firetv-android :app:assembleDebug --stacktrace

      - name: Compile Android phone and tablet debug APK
        run: gradle -p android-mobile :app:assembleDebug --stacktrace

      - name: Commit finished episode playback flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/mg/PlayerProvider.jsx \
            src/components/mg/MediaGodV2Assist.jsx \
            src/components/mg/VideoPlayer.jsx \
            src/components/mg/FireTvPlayerTakeover.jsx \
            src/components/mg/mediaEdition.js \
            firetv-android/app/src/main/java/com/mediagod/firetv/PlayerActivity.kt \
            scripts/episode-playback-regression-check.mjs
          if git diff --cached --quiet; then
            echo "No episode playback changes remained to commit."
          else
            git commit -m "Finish episode playback flow"
            git push origin HEAD:main
          fi
