name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows-desktop/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

concurrency:
  group: media-god-windows-desktop
  cancel-in-progress: true

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Windows desktop dependencies
        shell: pwsh
        working-directory: windows-desktop
        run: npm install --no-audit --no-fund

      - name: Build Media God Windows executable
        shell: pwsh
        working-directory: windows-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media-God-Windows
          path: windows-desktop/dist/Media-God-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-desktop-latest --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create windows-desktop-latest `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Media God - Windows" `
              --notes "Latest Media God Windows desktop build. This native shell gives the player true Windows fullscreen so the taskbar can disappear during playback."

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          gh release upload windows-desktop-latest windows-desktop/dist/Media-God-Windows.exe `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
