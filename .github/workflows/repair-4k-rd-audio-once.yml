name: Repair 4K RD failover and compatibility audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-4k-rd-audio-once.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted repair
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) A permanent RD 451/infringing rejection is not a cache operation.
          # It must bypass the "keep this uncached torrent selected" guard and
          # reach VideoPlayer's existing immediate source-failover path.
          video = root / 'src/components/mg/VideoPlayer.jsx'
          text = video.read_text()
          needle = '''    const hardFailureMessage =
              /(?:\\b451\\b|infringing[_ -]?file|copyright|wrong\\s+ip|rate[-\\s]?limit|not\\s+cached|couldn['’]?t\\s+start|could\\s+not\\s+start|comet\\s+returned\\s+its\\s+error)/i.test(
                String(message || "")
              );
'''
          if needle not in text:
              raise SystemExit('VideoPlayer hard-failure block was not found')
          replacement = needle + '''
            const permanentRdTorrentRejection =
              /(?:\\b451\\b|infringing[_ -]?file|copyright|infringing)/i.test(
                String(message || "")
              );
'''
          text = text.replace(needle, replacement, 1)

          cache_guard = '''    if (sourceNeedsCaching(active)) {'''
          cache_pos = text.find(cache_guard, text.find('const permanentRdTorrentRejection'))
          if cache_pos < 0:
              raise SystemExit('VideoPlayer uncached guard was not found')
          text = (
              text[:cache_pos]
              + '''    if (sourceNeedsCaching(active) && !permanentRdTorrentRejection) {'''
              + text[cache_pos + len(cache_guard):]
          )
          video.write_text(text)

          # 2) Strengthen LibVLC fallback audio. Compatibility playback should
          # always emit decoded stereo PCM, restore audible volume, and select a
          # real audio track if a difficult remux opens with no active track.
          for rel in [
              'firetv-android/app/src/main/java/com/mediagod/firetv/CompatibilityPlayerActivity.kt',
              'android-mobile/app/src/main/java/com/mediagod/mobile/CompatibilityPlayerActivity.kt',
          ]:
              path = root / rel
              body = path.read_text()
              audio_setup = '''                player.setAudioOutput("android_audiotrack")
                player.setAudioDigitalOutputEnabled(false)
                player.setAudioOutputDevice("stereo")'''
              if audio_setup not in body:
                  raise SystemExit(f'Audio compatibility setup missing in {rel}')
              body = body.replace(
                  audio_setup,
                  audio_setup + '''
                player.setVolume(100)''',
                  1,
              )

              playing_needle = '''                        MediaPlayer.Event.Playing -> {
                            window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                            statusText.text = "Compatibility decoder"
'''
              if playing_needle not in body:
                  raise SystemExit(f'Playing event block missing in {rel}')
              playing_replacement = playing_needle + '''
                            try {
                                player.setVolume(100)
                                if (player.audioTrack < 0) {
                                    player.audioTracks
                                        ?.firstOrNull { it.id >= 0 }
                                        ?.let { player.setAudioTrack(it.id) }
                                }
                            } catch (_: Throwable) {
                                // Keep playback running even if a vendor VLC build
                                // exposes an unusual audio-track table.
                            }
'''
              body = body.replace(playing_needle, playing_replacement, 1)
              path.write_text(body)

          # 3) Bump native app versions so installed devices are offered the fix.
          fire_gradle = root / 'firetv-android/app/build.gradle.kts'
          body = fire_gradle.read_text()
          body = body.replace('versionCode = 26', 'versionCode = 27', 1)
          body = body.replace('versionName = "1.4.21"', 'versionName = "1.4.22"', 1)
          fire_gradle.write_text(body)

          mobile_gradle = root / 'android-mobile/app/build.gradle.kts'
          body = mobile_gradle.read_text()
          body = body.replace('versionCode = 11', 'versionCode = 12', 1)
          body = body.replace('versionName = "1.0.10"', 'versionName = "1.0.11"', 1)
          mobile_gradle.write_text(body)

          structure = root / 'scripts/native-structure-check.mjs'
          body = structure.read_text()
          body = body.replace('expectedVersion: "1.4.21"', 'expectedVersion: "1.4.22"', 1)
          body = body.replace('expectedVersion: "1.0.10"', 'expectedVersion: "1.0.11"', 1)
          body = body.replace(
              '[compatibilityActivity.includes("setAudioOutputDevice(\\"stereo\\")"), "stereo PCM compatibility output"],',
              '[compatibilityActivity.includes("setAudioOutputDevice(\\"stereo\\")"), "stereo PCM compatibility output"],\n    [compatibilityActivity.includes("setVolume(100)"), "compatibility audio volume restore"],\n    [compatibilityActivity.includes("audioTracks"), "compatibility audio track rescue"],',
              1,
          )
          structure.write_text(body)

          fire_update = root / 'public/firetv-update.json'
          body = fire_update.read_text()
          body = body.replace('"versionCode": 26', '"versionCode": 27', 1)
          body = body.replace('"versionName": "1.4.21"', '"versionName": "1.4.22"', 1)
          body = re.sub(
              r'"message": ".*?",',
              '"message": "Fire TV 1.4.22 fixes two 4K recovery problems: Real-Debrid 451/infringing torrent rejections now bypass the uncached-torrent hold and immediately advance to the next source, while LibVLC compatibility playback forces decoded stereo PCM, restores full volume and selects an available audio track when a difficult remux opens silently.",',
              body,
              count=1,
          )
          fire_update.write_text(body)

          mobile_update = root / 'public/android-mobile-update.json'
          body = mobile_update.read_text()
          body = body.replace('"versionCode": 11', '"versionCode": 12', 1)
          body = body.replace('"versionName": "1.0.10"', '"versionName": "1.0.11"', 1)
          body = re.sub(
              r'"message": ".*?",',
              '"message": "Media God Mobile 1.0.11 fixes two 4K recovery problems: Real-Debrid 451/infringing torrent rejections now bypass the uncached-torrent hold and immediately advance to the next source, while LibVLC compatibility playback forces decoded stereo PCM, restores full volume and selects an available audio track when a difficult remux opens silently.",',
              body,
              count=1,
          )
          mobile_update.write_text(body)

          # Protect the exact RD regression in the normal UI gate as well.
          ui_check = root / 'scripts/ui-regression-check.mjs'
          body = ui_check.read_text()
          anchor = '''expect(
  videoPlayer.includes("const selectorOpenKey = (event) =>")'''
          if anchor not in body:
              raise SystemExit('UI regression anchor missing')
          guard = '''expect(
  videoPlayer.includes("const permanentRdTorrentRejection =") &&
    videoPlayer.includes("sourceNeedsCaching(active) && !permanentRdTorrentRejection"),
  "permanent Real-Debrid rejection can no longer bypass automatic source failover"
);

'''
          body = body.replace(anchor, guard + anchor, 1)
          ui_check.write_text(body)

      - name: Run regression checks
        run: |
          npm ci
          node scripts/ui-regression-check.mjs
          node scripts/native-structure-check.mjs

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/mg/VideoPlayer.jsx \
                  firetv-android/app/src/main/java/com/mediagod/firetv/CompatibilityPlayerActivity.kt \
                  android-mobile/app/src/main/java/com/mediagod/mobile/CompatibilityPlayerActivity.kt \
                  firetv-android/app/build.gradle.kts \
                  android-mobile/app/build.gradle.kts \
                  public/firetv-update.json \
                  public/android-mobile-update.json \
                  scripts/native-structure-check.mjs \
                  scripts/ui-regression-check.mjs
          git commit -m "Fix RD rejection failover and silent 4K audio"
          git push origin HEAD:main
