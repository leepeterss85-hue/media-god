<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (() => {
        const isDesktopMediaGod = () => {
          const ua = `${navigator.userAgent || ""} ${navigator.platform || ""}`;

          if (/(?:Android|iPhone|iPad|iPod|Fire\s*TV|AmazonWebAppPlatform|Silk|MediaGodFireTV|\bAFT[A-Z0-9]*\b)/i.test(ua)) {
            return false;
          }

          return Boolean(
            document.documentElement.requestFullscreen ||
              document.documentElement.webkitRequestFullscreen ||
              document.documentElement.mozRequestFullScreen ||
              document.documentElement.msRequestFullscreen
          );
        };

        const fullscreenElement = () =>
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          null;

        const requestTrueFullscreen = async () => {
          if (!isDesktopMediaGod() || fullscreenElement()) {
            return;
          }

          const root = document.documentElement;

          try {
            if (typeof root.requestFullscreen === "function") {
              try {
                await root.requestFullscreen({ navigationUI: "hide" });
              } catch {
                await root.requestFullscreen();
              }
              return;
            }

            if (typeof root.webkitRequestFullscreen === "function") {
              await Promise.resolve(root.webkitRequestFullscreen());
              return;
            }

            if (typeof root.mozRequestFullScreen === "function") {
              await Promise.resolve(root.mozRequestFullScreen());
              return;
            }

            if (typeof root.msRequestFullscreen === "function") {
              await Promise.resolve(root.msRequestFullscreen());
            }
          } catch {
            // VideoPlayer keeps its CSS fullscreen fallback if the host blocks
            // the browser Fullscreen API. A later trusted gesture will retry.
          }
        };

        const wantsFullscreenFromTarget = (target) => {
          if (!(target instanceof Element)) {
            return false;
          }

          const button = target.closest(
            'button[aria-label*="fullscreen" i], button[title*="fullscreen" i]'
          );

          if (button) {
            const label = `${button.getAttribute("aria-label") || ""} ${button.getAttribute("title") || ""}`;
            return !/exit|leave/i.test(label);
          }

          return false;
        };

        const cssFullscreenIsActive = () =>
          Boolean(document.querySelector('[data-mg-fullscreen="true"]'));

        document.addEventListener(
          "pointerdown",
          (event) => {
            if (!isDesktopMediaGod() || fullscreenElement()) {
              return;
            }

            if (
              wantsFullscreenFromTarget(event.target) ||
              cssFullscreenIsActive()
            ) {
              requestTrueFullscreen();
            }
          },
          true
        );

        document.addEventListener(
          "keydown",
          (event) => {
            if (!isDesktopMediaGod() || fullscreenElement()) {
              return;
            }

            const target = event.target;
            const typing =
              target instanceof HTMLInputElement ||
              target instanceof HTMLTextAreaElement ||
              target?.isContentEditable;

            if (typing) {
              return;
            }

            if (
              event.key === "f" ||
              event.key === "F" ||
              cssFullscreenIsActive()
            ) {
              requestTrueFullscreen();
            }
          },
          true
        );

        document.addEventListener(
          "dblclick",
          (event) => {
            if (!isDesktopMediaGod() || fullscreenElement()) {
              return;
            }

            const target = event.target;
            if (
              target instanceof Element &&
              (target.closest('[data-mg-player-root="true"]') ||
                target.closest('[data-mg-fullscreen="true"]'))
            ) {
              requestTrueFullscreen();
            }
          },
          true
        );
      })();
    </script>

    <script>
      (() => {
        /*
         * Real-Debrid can keep reporting a torrent as "downloading" with a
         * tiny/stale speed for hours. Media God should not strand the viewer
         * on a 40-50 GB uncached source that cannot become playable soon.
         * This watchdog observes the player UI and moves to the best unused
         * source when the current cache job is clearly impractical.
         */
        const state = {
          root: null,
          activeValue: "",
          activeSince: 0,
          lastProgress: null,
          lastProgressAt: 0,
          tried: new Set(),
          lastSwitchAt: 0,
        };

        const parseBytesPerSecond = (text) => {
          const match = String(text || "").match(/([\d.]+)\s*(B|KB|MB|GB|TB)\/s/i);
          if (!match) return 0;
          const amount = Number(match[1] || 0);
          const unit = String(match[2] || "B").toUpperCase();
          const multipliers = {
            B: 1,
            KB: 1024,
            MB: 1024 ** 2,
            GB: 1024 ** 3,
            TB: 1024 ** 4,
          };
          return Math.max(0, amount * (multipliers[unit] || 1));
        };

        const parseByteAmount = (amount, unit) => {
          const multipliers = {
            B: 1,
            KB: 1024,
            MB: 1024 ** 2,
            GB: 1024 ** 3,
            TB: 1024 ** 4,
          };
          return Math.max(
            0,
            Number(amount || 0) *
              (multipliers[String(unit || "B").toUpperCase()] || 1)
          );
        };

        const estimatedSecondsRemaining = (text, speed) => {
          if (!(speed > 0)) return Infinity;
          const match = String(text || "").match(
            /([\d.]+)\s*(B|KB|MB|GB|TB)\s+of\s+([\d.]+)\s*(B|KB|MB|GB|TB)/i
          );
          if (!match) return Infinity;
          const downloaded = parseByteAmount(match[1], match[2]);
          const total = parseByteAmount(match[3], match[4]);
          return Math.max(0, total - downloaded) / speed;
        };

        const reset = () => {
          state.root = null;
          state.activeValue = "";
          state.activeSince = 0;
          state.lastProgress = null;
          state.lastProgressAt = 0;
          state.tried = new Set();
          state.lastSwitchAt = 0;
        };

        const chooseBackup = (select) => {
          const options = Array.from(select?.options || []);
          if (options.length < 2) return null;

          const usable = options.filter((option) => {
            const value = String(option.value);
            const label = String(option.textContent || "");
            return (
              value !== String(select.value) &&
              !state.tried.has(value) &&
              !/unavailable/i.test(label)
            );
          });

          return (
            usable.find((option) => !/uncached/i.test(option.textContent || "")) ||
            usable[0] ||
            null
          );
        };

        const switchSource = (select, option, reason) => {
          if (!select || !option) return false;

          const now = Date.now();
          if (now - state.lastSwitchAt < 12000) return false;

          state.tried.add(String(select.value));
          state.lastSwitchAt = now;

          window.dispatchEvent(
            new CustomEvent("mg:player-status", {
              detail: { message: reason },
            })
          );

          select.value = String(option.value);
          select.dispatchEvent(new Event("input", { bubbles: true }));
          select.dispatchEvent(new Event("change", { bubbles: true }));
          return true;
        };

        window.setInterval(() => {
          const root = document.querySelector(
            '[data-mg-player-root="true"][data-mg-rd-cache-source="true"]'
          );

          if (!root) {
            if (state.root) reset();
            return;
          }

          const text = String(root.textContent || "");
          if (!/Caching to Real-Debrid/i.test(text)) return;

          const select = root.querySelector('select[aria-label="Choose playback source"]');
          if (!(select instanceof HTMLSelectElement)) return;

          if (state.root !== root) {
            reset();
            state.root = root;
          }

          const currentValue = String(select.value);
          const now = Date.now();

          if (state.activeValue !== currentValue) {
            state.activeValue = currentValue;
            state.activeSince = now;
            state.lastProgress = null;
            state.lastProgressAt = now;
            state.tried.add(currentValue);
          }

          const progressMatch = text.match(/(?:Caching\s+)?(\d{1,3})%/i);
          const progress = progressMatch ? Number(progressMatch[1]) : null;

          if (progress != null && progress !== state.lastProgress) {
            state.lastProgress = progress;
            state.lastProgressAt = now;
          }

          const speed = parseBytesPerSecond(text);
          const etaSeconds = estimatedSecondsRemaining(text, speed);
          const sourceAgeMs = now - state.activeSince;
          const noProgressMs = now - state.lastProgressAt;
          const backup = chooseBackup(select);

          if (!backup) return;

          /*
           * If the remaining download would take over 90 minutes at RD's
           * reported speed, it is not a sensible playback source. Give RD a
           * short grace period, then move to a cached/faster alternative.
           */
          if (sourceAgeMs >= 25000 && etaSeconds > 90 * 60) {
            switchSource(
              select,
              backup,
              "That uncached torrent is far too slow to become playable — trying a faster/cached source…"
            );
            return;
          }

          /* A truly flat cache job should never spin forever. */
          if (sourceAgeMs >= 60000 && noProgressMs >= 60000 && speed <= 0) {
            switchSource(
              select,
              backup,
              "Real-Debrid is not making download progress — trying another source…"
            );
          }
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
